# nginx terminates TLS and proxies to Flask on 127.0.0.1:8000 (flask_app.service sets PORT=8000).
# Flask's own TLS server does the handshake in its single accept thread, so one client that never
# finishes a handshake (common with internet scanners) hangs HTTPS for everyone; nginx doesn't.
# Installed by restore.sh to /etc/nginx/conf.d/samyak-jain.tech.conf.

upstream flask_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name samyak-jain.tech www.samyak-jain.tech;

    # certbot renewals (webroot); everything else goes to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://samyak-jain.tech$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name samyak-jain.tech www.samyak-jain.tech;

    ssl_certificate     /etc/letsencrypt/live/samyak-jain.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samyak-jain.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # SlideCraft document uploads and Aura voice clips
    client_max_body_size 50m;

    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Gemini deck generation / Canva autofill polling can take minutes
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
